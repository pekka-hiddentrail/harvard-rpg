# cs_honors.yaml — Computer Science, Honors Requirements (13–16 courses / 52–64 credits).
#
# Same arithmetic logic as cs_basic.yaml: Programming 1 & 2 (2) + Intermediate Algorithms
# (1, replaces Basic's Formal Reasoning with a harder version) + Artificial Intelligence
# (1, new) + Systems (1) + Computation and the World (1) + Advanced CS (5) = 11.
id: cs_honors
name: "Computer Science (Honors)"
field: cs
honorsEligible: true
thesisRequired: false
declareBy:
  year: 2
  term: fall
diploma: "Computer Science"

requirements:
  - id: math-prep
    label: "Math prep"
    kind: sequence
    need: 1
    sequence: [math1a, math1b]
    min: 0
    max: 2
    # Only if placement testing shows it's needed. Same as the Basic track.

  - id: linear-algebra
    label: "Linear algebra"
    kind: set
    need: 1
    from:
      - math21b
      - math22a
      - math23a
      - math25a
      - math55a
      - am22a
    # Same options as the Basic track.

  - id: probability
    label: "Probability"
    kind: set
    need: 1
    from:
      - stat110
      - stat111
      - stat210
      - higher_probability_or_stats_course
    # Same options as the Basic track.

  - id: cs-core
    label: "CS core"
    kind: set
    need: 11
    from:
      # The fixed spine (6 courses):
      - programming_1
      - programming_2
      - intermediate_algorithms
      - artificial_intelligence
      - systems
      - computation_and_world
      # 5 Advanced CS electives, one more than the Basic track:
      - advanced_cs_a
      - advanced_cs_b
      - advanced_cs_c
      - advanced_cs_d
      - advanced_cs_e

  - id: thesis
    label: "Senior thesis"
    kind: course
    need: 1
    from: [honors_thesis]
    optional: true
    # Optional for honors generally, but required for high or highest honors.

courseHints:
  - id: math21b
    title: "Math 21b"
    likelyTracks: [cs_basic, cs_honors, cs_mbb]
    countsToward: [linear-algebra, cs-core]
    leadsTo: [cs_honors]
    notes:
      - "Default linear algebra route."

  - id: stat110
    title: "Statistics 110"
    likelyTracks: [cs_basic, cs_honors, cs_mbb]
    countsToward: [probability]
    leadsTo: [cs_honors]
    notes:
      - "Default probability requirement."
