# cs_joint.yaml — Computer Science, Joint Concentration (10–13 courses / 40–52 credits, CS side).
#
# Not a double major: meant for genuine intersection interests (e.g. CS + Linguistics for
# computational linguistics). Thesis is required, combines both fields, and is read by both
# departments.
id: cs_joint
name: "Computer Science (Joint Concentration)"
field: cs
honorsEligible: false
thesisRequired: true
declareBy:
  year: 2
  term: fall
diploma: "Joint Concentration — paired field varies by student"

requirements:
  - id: math-prep
    label: "Math prep"
    kind: sequence
    need: 1
    sequence: [math1a, math1b]
    min: 0
    max: 2
    # Only if placement testing shows it's needed. Same as the Basic track.

  - id: linear-algebra
    label: "Linear algebra"
    kind: set
    need: 1
    from:
      - math21b
      - math22a
      - math23a
      - math25a
      - math55a
      - am22a
    # Same options as the Basic track.

  - id: probability
    label: "Probability"
    kind: set
    need: 1
    from:
      - stat110
      - stat111
      - stat210
      - higher_probability_or_stats_course
    # Same options as the Basic track.

  - id: cs-core
    label: "CS core (joint side)"
    kind: set
    need: 8
    from:
      # Same fixed spine as the Basic track:
      - programming_1
      - programming_2
      - formal_reasoning
      - systems
      - computation_and_world
      # 3 Advanced CS electives — one fewer than Basic. The source material states 8
      # courses total without naming which one drops; the reduction is modeled here on the
      # flexible Advanced CS slot rather than the fixed spine. Confirm once the real
      # requirement sheet is available.
      - advanced_cs_a
      - advanced_cs_b
      - advanced_cs_c

  - id: thesis
    label: "Joint thesis"
    kind: course
    need: 1
    from: [joint_thesis]
    # Required, not optional — combines both fields and is read by both departments.

courseHints:
  - id: math21b
    title: "Math 21b"
    likelyTracks: [cs_basic, cs_honors, cs_joint, cs_mbb]
    countsToward: [linear-algebra, cs-core]
    leadsTo: [cs_joint]
    notes:
      - "Default linear algebra route."

  - id: stat110
    title: "Statistics 110"
    likelyTracks: [cs_basic, cs_honors, cs_joint, cs_mbb]
    countsToward: [probability]
    leadsTo: [cs_joint]
    notes:
      - "Default probability requirement."
