# cs_basic.yaml — Computer Science, Basic Requirements (11–14 courses / 44–56 credits).
#
# "Formal Reasoning" is modeled here as ONE combined course covering discrete math,
# computational limits, and algorithms. That reading is the only one whose arithmetic totals
# to the stated 9-course CS core: Programming 1 & 2 (2) + Formal Reasoning (1) + Systems (1) +
# Computation and the World (1) + Advanced CS (4) = 9. Confirm once real course codes arrive.
#
# Course ids below (programming_1, formal_reasoning, advanced_cs_a..e, ...) are placeholders
# pending the actual syllabi; rename them in place once real course codes are known so this
# file and its courseHints keep matching.
id: cs_basic
name: "Computer Science"
field: cs
honorsEligible: false
thesisRequired: false
declareBy:
  year: 2
  term: fall
diploma: "Computer Science"

requirements:
  - id: math-prep
    label: "Math prep"
    kind: sequence
    need: 1
    sequence: [math1a, math1b]
    min: 0
    max: 2
    # Only if placement testing shows it's needed.

  - id: linear-algebra
    label: "Linear algebra"
    kind: set
    need: 1
    from:
      - math21b
      - math22a
      - math23a
      - math25a
      - math55a
      - am22a
    # 21b/22a are the default routes.

  - id: probability
    label: "Probability"
    kind: set
    need: 1
    from:
      - stat110
      - stat111
      - stat210
      - higher_probability_or_stats_course
    # Stat 110 is the standard default.

  - id: cs-core
    label: "CS core"
    kind: set
    need: 9
    from:
      # The fixed spine (5 courses):
      - programming_1
      - programming_2
      - formal_reasoning
      - systems
      - computation_and_world
      # 4 Advanced CS electives, drawn from this pool:
      - advanced_cs_a
      - advanced_cs_b
      - advanced_cs_c
      - advanced_cs_d
      - advanced_cs_e

courseHints:
  - id: math21b
    title: "Math 21b"
    likelyTracks: [cs_basic, cs_honors, cs_mbb]
    countsToward: [linear-algebra, cs-core]
    leadsTo: [cs_basic]
    notes:
      - "Default linear algebra route."

  - id: stat110
    title: "Statistics 110"
    likelyTracks: [cs_basic, cs_honors, cs_mbb]
    countsToward: [probability]
    leadsTo: [cs_basic]
    notes:
      - "Default probability requirement."
