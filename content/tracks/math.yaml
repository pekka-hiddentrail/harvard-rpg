# math.yaml — Mathematics concentration, straight from the Department of Mathematics'
# undergraduate brochure. Structured differently from CS/Econ: there is no separate Basic
# vs. Honors track — one set of 12 letter-graded courses, with honors gated purely on
# whether a senior thesis is written, not on extra coursework.
#
# `thesisRequired: false` plus an `optional: true` thesis requirement below models "honors
# is thesis-gated, not mandatory for the concentration itself." The schema has no
# group-level "either/or", so Straight Honors' "thesis OR four extra courses" alternative
# is a note rather than a constraint.
#
# WHAT CHANGED, AND WHY IT MATTERS: this file used to name twenty course ids that did not
# exist (`math_100_level_a`, `math_algebra_b`, `related_field_c`, …), so the track could not
# be solved at all — every group asked for courses no player could ever shop for. Every
# reference below is now a real `courseCode` in `content/courses/`, with two deliberate
# exceptions named in `notes`: the expository paper and the senior thesis are deliverables,
# not courses you enrol in, and the catalogue is right not to have them. The solver reports
# those two as abstract slots rather than as content bugs.
#
# The one departmental rule the catalogue cannot yet support is "at least 4 of the 8
# Mathematics-labeled courses must be 100-level" — content has exactly two 100-level math
# courses (Math 101, Math 154). Noted below rather than enforced against courses that would
# have to be invented to enforce it.
id: math
name: "Mathematics"
field: math
honorsEligible: true
thesisRequired: false
declareBy:
  year: 2
  term: fall
diploma: "Mathematics"

requirements:
  - id: math-courses
    label: "Mathematics-labeled courses"
    kind: set
    need: 8
    # The three breadth courses count toward this group rather than adding to it. That rule
    # used to live only in the note below, where nothing could enforce it.
    counts: [breadth-analysis, breadth-algebra, breadth-geometry-topology]
    from:
      - mathma
      - mathmb
      - math1a
      - math1b
      - math21a
      - math21b
      - math22a
      - math22b
      - math23a
      - math25a
      - math25b
      - math55a
      - math55b
      - math101
      - math154
    notes:
      - "At least 4 of the 8 must be 100-level. Content has two (Math 101, Math 154), so this sub-rule is not enforced."
      - "Math Ma + Mb count as one combined credit toward this group, not two."
      - "One Freshman Seminar may replace one of the twelve courses with DUS permission, but never the breadth requirement."

  - id: related-field-courses
    label: "Related-field courses"
    kind: set
    need: 4
    from:
      - am22a
      - am22b
      - am101
      - apmth10
      - apmth50
      - apphy50a
      - apphy50b
      - cs20
      - cs50
      - cs51
      - cs61
      - cs1200
      - cs1210
      - cs1240
      - stat100
      - stat110
      - stat111
      - stat139
    notes:
      - "In Mathematics itself or an approved related field: Applied Math, CS, Economics, Engineering Sciences, Physics, Applied Physics, or Statistics."

  - id: breadth-analysis
    label: "Breadth: Analysis"
    kind: set
    need: 1
    from: [math23a, math25a, math25b, math55b]
    notes:
      - "Analysis, Algebra and Geometry/Topology are the department's three main branches."
      - "These three breadth courses count toward the 8 Mathematics-labeled courses above, not as 3 more on top."

  - id: breadth-algebra
    label: "Breadth: Algebra"
    kind: set
    need: 1
    from: [math55a, math101]

  - id: breadth-geometry-topology
    label: "Breadth: Geometry/Topology"
    kind: set
    need: 1
    from: [math101]
    notes:
      - "Math 101 (Sets, Groups and Topology) is the only course in content touching this branch, so it is the only route — and it cannot also be the Algebra course."

  - id: expository-paper
    label: "Math Expository Requirement"
    kind: course
    need: 1
    from: [math_expository_paper]
    notes:
      - "A 5-page expository paper on an approved topic, due by end of third year."
      - "Not a course: usually satisfied inside a tutorial (Math 99r), a reading course (Math 91r), or a 100/200-level course you are already taking."

  - id: thesis
    label: "Senior thesis"
    kind: course
    need: 1
    from: [math_senior_thesis]
    optional: true
    notes:
      - "Not a course. High or Highest Honors requires it: original exposition, no new theorems needed, any pure or applied topic not directly covered by coursework."
      - "Straight Honors is thesis OR four extra courses beyond the required twelve — an either/or the schema cannot express."
      - "The department urges everyone to write one anyway, calling it better research preparation than coursework alone."

courseHints:
  - id: mathma
    title: "Math Ma"
    likelyTracks: [math]
    countsToward: [math-courses]
    leadsTo: [math1a]
    notes:
      - "Placement-based starting point: Math M/1 works up through 1a/1b, then 21a/b."

  - id: math1a
    title: "Math 1a"
    likelyTracks: [math]
    countsToward: [math-courses]
    leadsTo: [math1b]
    notes:
      - "Follows Math Ma/Mb placement. Leads into 21a/b."

  - id: math1b
    title: "Math 1b"
    likelyTracks: [math]
    countsToward: [math-courses]
    leadsTo: [math21a]
    notes:
      - "Follows Math 1a. Leads into 21a/b."

  - id: math21a
    title: "Math 21a"
    likelyTracks: [math, econ_honors_thesis, econ_honors_advanced]
    countsToward: [math-courses]
    leadsTo: [math101]
    notes:
      - "Placed into 18/19/21: same 21a/b track, with Math 101 as the proof-writing course afterward."

  - id: math21b
    title: "Math 21b"
    likelyTracks: [math, cs_basic, cs_honors, cs_mbb, cs_joint]
    countsToward: [math-courses]
    leadsTo: [math101]
    notes:
      - "Same placement track as 21a."

  - id: math101
    title: "Math 101"
    likelyTracks: [math]
    countsToward: [math-courses, breadth-algebra, breadth-geometry-topology]
    leadsTo: [math154]
    notes:
      - "Proof-writing intro, taken after or alongside 1a/1b/21a/21b depending on placement."
      - "The only Geometry/Topology route in content — spending it on Algebra closes that branch."

  - id: math23a
    title: "Math 23a"
    likelyTracks: [math, cs_mbb]
    countsToward: [math-courses, breadth-analysis]
    leadsTo: [math25a]
    notes:
      - "Linear algebra and real analysis together; the gentler of the two proof-first routes."

  - id: math25a
    title: "Math 25a"
    likelyTracks: [math, cs_basic, cs_honors, cs_mbb]
    countsToward: [math-courses, breadth-analysis]
    leadsTo: [math25b]
    notes:
      - "Placed into 22/25 (strong interest): starts directly here, skipping 1a/1b/21a/21b."

  - id: math25b
    title: "Math 25b"
    likelyTracks: [math]
    countsToward: [math-courses, breadth-analysis]
    leadsTo: [math101]
    notes:
      - "Follows 25a."

  - id: math55a
    title: "Math 55a"
    likelyTracks: [math, cs_basic, cs_honors, cs_mbb]
    countsToward: [math-courses, breadth-algebra]
    leadsTo: [math55b]
    notes:
      - "The fastest, most rigorous option. Legendary intensity."

  - id: math55b
    title: "Math 55b"
    likelyTracks: [math]
    countsToward: [math-courses, breadth-analysis]
    leadsTo: [math101]
    notes:
      - "Follows 55a. Real and complex analysis, so it is the Analysis branch for anyone on the 55 track."

  - id: math154
    title: "Math 154"
    likelyTracks: [math]
    countsToward: [math-courses]
    leadsTo: [math]
    notes:
      - "One of only two 100-level math courses in content, so it does double duty for the 100-level rule."
