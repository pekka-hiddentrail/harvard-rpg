# cs_mbb.yaml — Computer Science, Mind Brain & Behavior (13–16 courses / 52–64 credits).
# Honors-only, affiliated with the university-wide MBB Initiative. This is Pekka's track.
id: cs_mbb
name: "Computer Science — Mind, Brain & Behavior"
field: cs
honorsEligible: true
thesisRequired: true
declareBy:
  year: 2
  term: fall
diploma: "Computer Science"

requirements:
  - id: math-prep
    label: "Math prep"
    kind: sequence
    need: 1
    sequence: [math1a, math1b]
    min: 0
    max: 2
    # Only if placement testing shows it's needed.

  - id: linear-algebra
    label: "Linear algebra"
    kind: set
    need: 1
    from:
      - math21b
      - math22a
      - math23a
      - math25a
      - math55a
      - am22a
    # 21b/22a are the default routes; 23a/25a/55a are progressively more rigorous honors
    # tracks. Any advanced linear algebra course also counts.

  - id: probability
    label: "Probability"
    kind: set
    need: 1
    from:
      - stat110
      - stat111
      - stat210
      - higher_probability_or_stats_course
    # Stat 110 is the standard default; any more advanced probability or statistics
    # course qualifies.

  - id: cs-core
    label: "CS core"
    kind: set
    need: 8
    from:
      - programming_1
      - programming_2
      - formal_reasoning
      - systems
      - computation_and_world
      # 4 Advanced CS electives instead of Honors' 5:
      - advanced_cs_a
      - advanced_cs_b
      - advanced_cs_c
      - advanced_cs_d
      # CS 91r may count toward this group as well as toward the thesis requirement below —
      # the two are not double-counted against the 8, but 91r can satisfy either.
      - cs91r
    # 8 courses total, vs. 11 for straight Honors. The exact composition beyond "4 fewer
    # Advanced CS" is not fully specified in the source material; confirm once the real
    # requirement sheet is available.

  - id: mbb-core
    label: "MBB core"
    kind: set
    need: 3
    from:
      - neuro80
      - approved_mbb_elective
      - approved_mbb_junior_tutorial
    # One neuroscience course, one MBB-related course outside CS, and one approved junior
    # tutorial. Also required, outside the course count: an adviser in the MBB milieu,
    # annual registration on the MBB website, and a non-credit senior seminar for MBB
    # thesis writers.

  - id: thesis
    label: "MBB thesis"
    kind: course
    need: 1
    from: [cs91r]
    # Required, not optional — must be computationally-oriented and MBB-related.

courseHints:
  - id: math21b
    title: "Math 21b"
    likelyTracks: [cs_mbb, cs_basic, cs_honors]
    countsToward: [linear-algebra, cs-core]
    leadsTo: [cs_mbb]
    notes:
      - "Default linear algebra route."
      - "Strong fit for MBB and CS tracks."

  - id: math22a
    title: "Math 22a"
    likelyTracks: [cs_mbb, cs_honors]
    countsToward: [linear-algebra]
    leadsTo: [cs_mbb]
    notes:
      - "More proof-based than 21b."
      - "Normal alternative for mathematically inclined students."

  - id: math23a
    title: "Math 23a"
    likelyTracks: [cs_mbb, cs_honors]
    countsToward: [linear-algebra]
    leadsTo: [cs_mbb]
    notes:
      - "Honors-level theory route."
      - "Good fit for students aiming at deeper proof-heavy math."

  - id: math55a
    title: "Math 55a"
    likelyTracks: [cs_mbb, theory_heavy_cs]
    countsToward: [linear-algebra]
    leadsTo: [cs_mbb]
    notes:
      - "Legendary intensity."
      - "Signals a theory-heavy path."

  - id: stat110
    title: "Statistics 110"
    likelyTracks: [cs_mbb, cs_honors, cs_basic]
    countsToward: [probability]
    leadsTo: [cs_mbb]
    notes:
      - "Default probability requirement."
      - "Standard CS gateway."

  - id: neuro80
    title: "Neuroscience 80"
    likelyTracks: [cs_mbb]
    countsToward: [mbb-core]
    leadsTo: [cs_mbb]
    notes:
      - "Core MBB requirement."
      - "This is a major signpost for the track."

  - id: cs91r
    title: "CS 91r"
    likelyTracks: [cs_mbb, cs_honors]
    countsToward: [cs-core, thesis]
    leadsTo: [cs_mbb]
    notes:
      - "May serve as a thesis anchor."
      - "Especially relevant to MBB thesis work."
