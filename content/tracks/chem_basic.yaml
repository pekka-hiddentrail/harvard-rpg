# chem_basic.yaml — Chemistry, Basic Requirements (12-14 courses, 48-56 credits).
#
# The department enumerates its twelve exactly, which is rare and welcome: 2 general chemistry,
# 1 inorganic, 2 organic, 2 physical chemistry, 1 advanced laboratory, 1 biologically-oriented
# chemistry, 1 math, 2 physics. Those add to twelve with nothing left over, so there is no
# "additional courses to reach 12" group here — the enumeration *is* the twelve, and the 13-14
# figure is the same list plus Math 1a/1b for students who place into them.
#
# Content carries two chemistry courses: Chem 17 and Chem 27, the organic sequence. Everything
# else the department wants from its own department — inorganic, both physical chemistry courses,
# the advanced laboratory, the biologically-oriented course — is a slot. That is not a content
# bug so much as a content gap, and the solver reporting six abstract slots is the honest way to
# show a player that Chemistry is not currently shoppable end to end.
#
# No thesis at any level. The sophomore/junior tutorials (Chem 91r, 98r) are SAT/UNS graded and
# optional, so they are a note rather than a group.
id: chem_basic
name: "Chemistry"
field: chemistry
honorsEligible: false
thesisRequired: false
declareBy:
  year: 2
  term: fall
diploma: "Chemistry"

requirements:
  - id: math-prep
    label: "Math prep"
    kind: sequence
    need: 1
    sequence: [math1a, math1b]
    min: 0
    max: 2
    notes:
      - "Only if placement requires it. This is what turns the 12-course concentration into a 13- or 14-course one."

  - id: general-chemistry
    label: "General chemistry"
    kind: set
    need: 2
    from: [ps11, chem_general_chemistry_2]
    notes:
      - "PS 11 is the general chemistry course in content; its partner is not, so the second half is a slot."

  - id: inorganic-chemistry
    label: "Inorganic chemistry"
    kind: course
    need: 1
    from: [chem40]
    notes:
      - "Chem 40 or equivalent. Not in content."

  - id: organic-chemistry
    label: "Organic chemistry"
    kind: sequence
    need: 2
    sequence: [chem17, chem27]
    notes:
      - "Chem 17/27 or Chem 20/30 — two routes through the same material. Content carries 17/27, and the order is the requirement."

  - id: physical-chemistry
    label: "Physical chemistry"
    kind: set
    need: 2
    from: [chem_physical_1, chem_physical_2]
    notes:
      - "Two courses. Neither is in content."

  - id: advanced-laboratory
    label: "Advanced laboratory"
    kind: course
    need: 1
    from: [chem_advanced_laboratory]

  - id: biological-chemistry
    label: "Chemistry with a strong biological orientation"
    kind: course
    need: 1
    from: [chem_biological_orientation]

  - id: math
    label: "Mathematics"
    kind: set
    need: 1
    from: [math21a, math21b, am22a]
    notes:
      - "Math 21a or equivalent. The department strongly recommends 21b as well, but does not require it."

  - id: physics
    label: "Physics"
    kind: set
    need: 2
    from: [ps12a, ps12b, physics15a, physics15b, apphy50a, apphy50b, ps2, ps3]
    notes:
      - "Two courses, from whichever intro physics route you are on."
      - "Chem 91r and Chem 98r (sophomore and junior tutorials) are optional and SAT/UNS graded, so they count toward nothing here."
