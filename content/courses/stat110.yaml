# Statistics 110 — Probability. Course identity, instructor, scale, and curriculum are
# from the official Stat 110 site: Joe Blitzstein has taught the course since 2006, and the
# on-campus course enrolls more than 300 students. The site does not publish a term-specific
# schedule, office hours, or grading policy, so those logistical fields are authored estimates.
id: "113"
courseCode: "stat110"
title: "Statistics 110: Probability"
demand: 7
workloadHint: "~10-12h/week"
demands:
  math: 1
  stats: 3
meetings:
  - { type: lecture, days: [Tue, Thu], pattern: TTh, size: 300, attendance: flexible }
officeHours:
  - { type: officeHour, length: free, booked: false, days: [Tue, Thu], time: "14:00-16:00", location: "Science Center", demand: 6 }
