  - { n: 12, topic: "Conditional expectation" }
  - { n: 13, topic: "Continuous random variables" }
  - { n: 14, topic: "Uniform and normal distributions" }
  - { n: 15, topic: "Exponential distribution and memorylessness" }
  - { n: 16, topic: "Gamma and beta distributions" }
  - { n: 17, topic: "Transformations of random variables" }
  - { n: 18, topic: "Moment generating functions" }
  - { n: 19, topic: "Law of large numbers" }
  - { n: 20, topic: "Central limit theorem" }
  - { n: 21, topic: "Review for Midterm 2" }
  - { n: 22, topic: "Markov chains" }
  - { n: 23, topic: "Poisson processes" }
  - { n: 24, topic: "Simulation and Monte Carlo methods" }
  - { n: 25, topic: "Applications to statistics, risk, and randomness" }
  - { n: 26, topic: "Final review" }
