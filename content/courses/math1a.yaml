# Math 1a — Introduction to Calculus. Session order, meeting schedule, office hours,
# homework cadence, and 30% homework grade are from Prof. Oliver Knill's Spring 2020
# course site. This game places that real structure on Fall 2026's shared calendar.
# The site does not publish individual exam weights, so the two hourlies and final use
# an authored 20% / 20% / 30% split to complete the published grading total.
id: "601"
courseCode: "math1a"
title: "Math 1a: Introduction to Calculus"
demand: 7
workloadHint: "~10-12h/week"
demands:
