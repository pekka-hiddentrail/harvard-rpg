# CS 1210 — Introduction to the Theory of Computation. Course logistics, topics, homework,
# office hours, and grading derive from Harry Lewis's archived CS 121 syllabus and schedule.
# This game maps the source's TTh course to Fall 2026's 26 non-holiday meetings; its midterm
# replaces one lecture. The registrar-set final date remains an authored placeholder.
id: "210"
courseCode: "cs1210"
title: "CS 1210: Introduction to the Theory of Computation"
demand: 8
workloadHint: "~10-12h/week"
demands:
  math: 1
  proof: 3
meetings:
  - { type: lecture, days: [Tue, Thu], time: "10:00-11:30", size: 60, attendance: expected }
officeHours:
  - { type: officeHour, length: free, booked: false, days: [Sun], time: "20:00-22:00", location: "Cabot Dining Hall", demand: 7 }
  - { type: officeHour, length: free, booked: false, days: [Mon], time: "20:00-22:00", location: "Lowell Dining Hall", demand: 7 }
  - { type: officeHour, length: free, booked: false, days: [Tue], time: "15:00-17:00", location: "Currier Dining Hall", demand: 7 }
sessions:
  - { n: 1, topic: "Introduction and overview" }
  - { n: 2, topic: "Strings, languages, and induction" }
  - { n: 3, topic: "Finite automata" }
  - { n: 4, topic: "NFAs, DFAs, and closure properties" }
  - { n: 5, topic: "Regular expressions" }
  - { n: 6, topic: "Countability and uncountability" }
  - { n: 7, topic: "Pumping lemma and nonregular languages" }
  - { n: 8, topic: "DFA minimization and context-free grammars" }
  - { n: 9, topic: "Ambiguity of context-free grammars and pushdown automata" }
  - { n: 10, topic: "Context-free problem-solving session" }
  - { n: 11, topic: "CFGs versus PDAs and non-context-free languages" }
  - { n: 12, topic: "Context-free language recognition" }
  - { n: 13, topic: "CFL wrap-up; Hilbert and Turing" }
  - { n: 14, topic: "Midterm examination" }
  - { n: 15, topic: "Turing machines and the Church-Turing thesis" }
  - { n: 16, topic: "Recognizability and decidability" }
  - { n: 17, topic: "Turing's theorem" }
  - { n: 18, topic: "Reducibility" }
  - { n: 19, topic: "Partial recursive functions and undecidable questions" }
  - { n: 20, topic: "Computational complexity" }
  - { n: 21, topic: "Polynomial time" }
  - { n: 22, topic: "NP" }
  - { n: 23, topic: "P versus NP and NP-completeness" }
  - { n: 24, topic: "More NP-completeness" }
  - { n: 25, topic: "Cook-Levin and more on NP" }
  - { n: 26, topic: "Glimpses beyond and conclusions" }
