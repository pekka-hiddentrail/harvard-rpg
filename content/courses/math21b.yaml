# Math 21b — Linear Algebra and Differential Equations. Real, cross-checked course
# structure (department course page + Prof. Knill's published "hour to hour" syllabus,
# Bretscher's "Linear Algebra with Applications"), placed onto Fall 2026's real calendar
# since that's the term this game currently starts in (Sep 2026, per the CS50 example in
# GAME_DESIGN.md §4.1). Nothing here is invented content — session topics, the weekly PSet
# cadence, the two evening midterms, and the grading weights are the department's own
# stated pattern. Exact 2026 midterm dates are not published; the Thursday-evening slot IS
# published, so Oct 8 and Nov 5 are placed on real Thursdays following that pattern, not
# guessed at random.
id: math21b
title: "Math 21b: Linear Algebra and Differential Equations"
difficulty: 7
workloadHint: "~10-12h/week"
demands:
  math: 3
meetings:
  # MWF, 50 minutes, one of the real block-schedule slots (09:00, 10:30, 12:00, 13:30,
  # 15:00, 16:30) -- the specific slot a section lands on is a registration-time fact
  # (the shopping cart, not built yet), so this names the pattern/range, not one time.
  # Attendance flexible: a large lecture course like this is recorded, same as CS50.
  - { type: lecture, days: [Mon, Wed, Fri], pattern: MWF, size: 90, attendance: flexible }
sessions:
  # 36 real MWF meetings. Dates are computed by `fitSessions` from this course's meeting
  # pattern (Mon/Wed/Fri) against the shared `content/calendar/fall2026.yaml` term --
  # not authored per session, so a holiday exception lives in exactly one place. Topic
  # order and section numbers (Bretscher) are Knill's published lecture-by-lecture
  # breakdown.
  - { n: 1, topic: "Introduction to linear systems (1.1)" }
  - { n: 2, topic: "Gauss-Jordan elimination (1.2)" }
  - { n: 3, topic: "Solutions of linear systems (1.3)" }
  - { n: 4, topic: "Linear transformations (2.1)" }
  - { n: 5, topic: "Linear transformations in geometry (2.2)" }
  - { n: 6, topic: "Matrix product (2.3)" }
  - { n: 7, topic: "The inverse (2.4)" }
  - { n: 8, topic: "Image and kernel (3.1)" }
  - { n: 9, topic: "Basis and linear independence (3.2)" }
  - { n: 10, topic: "Dimension (3.3)" }
  - { n: 11, topic: "Change of coordinates (3.4)" }
  - { n: 12, topic: "Linear spaces (4.1)" }
  - { n: 13, topic: "Review for Midterm 1" }
  - { n: 14, topic: "Orthonormal bases and projections (5.1)" }
  - { n: 15, topic: "Gram-Schmidt and QR factorization (5.2)" }
  - { n: 16, topic: "Orthogonal transformations (5.3)" }
  - { n: 17, topic: "Least squares and data fitting (5.4)" }
  - { n: 18, topic: "Determinants I (6.1)" }
  - { n: 19, topic: "Determinants II (6.2)" }
  - { n: 20, topic: "Eigenvalues (7.1-7.2)" }
  - { n: 21, topic: "Eigenvectors (7.3)" }
  - { n: 22, topic: "Diagonalization (7.4)" }
  - { n: 23, topic: "Complex eigenvalues (7.5)" }
  - { n: 24, topic: "Review for Midterm 2" }
  - { n: 25, topic: "Stability, discrete dynamical systems (7.6)" }
  - { n: 26, topic: "Symmetric matrices / Spectral Theorem (8.1)" }
  - { n: 27, topic: "Differential equations I (9.1)" }
  - { n: 28, topic: "Differential equations II (9.2)" }
  - { n: 29, topic: "Nonlinear systems (9.4)" }
  - { n: 30, topic: "Linear operators (4.2)" }
  - { n: 31, topic: "Linear differential operators (9.3)" }
  - { n: 32, topic: "Inhomogeneous differential equations (handout)" }
  - { n: 33, topic: "Inner product spaces (5.5)" }
  - { n: 34, topic: "Fourier series (handout)" }
  - { n: 35, topic: "Parseval's identity (handout)" }
  - { n: 36, topic: "Partial differential equations (handout)" }
assignments:
