# Math 21b — Linear Algebra and Differential Equations. Real, cross-checked course
# structure (department course page + Prof. Knill's published "hour to hour" syllabus,
# Bretscher's "Linear Algebra with Applications"), placed onto Fall 2026's real calendar
# since that's the term this game currently starts in (Sep 2026, per the CS50 example in
# GAME_DESIGN.md §4.1). Nothing here is invented content — session topics, the weekly PSet
# cadence, the two evening midterms, and the grading weights are the department's own
# stated pattern. Exact 2026 midterm dates are not published; the Thursday-evening slot IS
# published, so Oct 8 and Nov 5 are placed on real Thursdays following that pattern, not
# guessed at random.
id: math21b
title: "Math 21b: Linear Algebra and Differential Equations"
difficulty: 7
workloadHint: "~10-12h/week"
demands:
  math: 3
meetings:
  # The department sections by time slot (9:00, 10:30, 12:00, 1:30, 3:00); this is the
  # 10:30 section. All five run the same syllabus, so only the band changes if the player
  # enrolls in a different slot.
  - { type: lecture, days: [Mon, Wed, Fri], band: "10:30", size: 90 }
