  # students get 2 late days across the term — neither is modeled yet (Syllabus has no
  # homework-policy field), so it's noted here rather than silently ignored.
  - { id: ps1, title: "Problem Set 1", kind: pset, assigned: 2026-09-02, due: 2026-09-11, estHours: 8, weight: 0.0208, dependsOnSessions: [1, 2, 3] }
