# CS50 — Fall 2026. Week topics and order are Malan's own published CS50 outline (stable
# across on-campus/edX/summer versions). `demands: {code: 2, math: 1}`, `difficulty: 7`
# and the `~12h/week` workload hint reuse the exact numbers GAME_DESIGN.md §4.1 already
# uses in its illustrative example — this file makes that example real and committed.
#
# Real CS50 has NO midterm exam — grading is problem sets + a final project (no exams).
# GAME_DESIGN's inline example included a `kind: exam` midterm only to demonstrate that
# mechanic; it is not reproduced here, since this file claims to be the real course.
#
# Also real, for later narrative use (not a schema field — no place to put it yet): CS50's
# academic-honesty policy explicitly permits CS50's own "Duck" AI tool but forbids
# ChatGPT, GitHub Copilot, or any other outside AI code-completion tool.
id: cs50
title: "CS50: Introduction to Computer Science"
difficulty: 7
workloadHint: "~12h/week"
demands:
  code: 2
  math: 1
meetings:
  # Real CS50 lecture: MW 9:00-10:30, always -- a fixed, published slot for everyone in
  # the course (not one of the three canonical 50/75-min blocks; CS50 gets its own
  # extended lecture time). Sections are a separate, real, concrete choice -- see the
  # four real section instances in `content/sections.yaml`, not authored here.
  # Attendance flexible: 340 people, and every lecture is recorded.
  - { type: lecture, days: [Mon, Wed], time: "09:00-10:30", size: 340, attendance: flexible }
sessions:
  - { n: 1, date: 2026-09-02, topic: "Scratch: computational thinking, algorithms, pseudocode" }
  - { n: 2, date: 2026-09-09, topic: "Scratch: functions, variables, conditionals, loops, events" }
  - { n: 3, date: 2026-09-14, topic: "C: source vs. machine code, compiling, types" }
  - { n: 4, date: 2026-09-16, topic: "C: conditionals, loops, integer overflow, floating-point imprecision" }
  - { n: 5, date: 2026-09-21, topic: "Arrays: preprocessing, compiling, assembling, linking; debugging" }
  - { n: 6, date: 2026-09-23, topic: "Arrays: strings, command-line arguments, intro cryptography" }
  - { n: 7, date: 2026-09-28, topic: "Algorithms: linear/binary search; bubble, selection, merge sort" }
  - { n: 8, date: 2026-09-30, topic: "Algorithms: Big-O/Omega/Theta notation, recursion" }
  - { n: 9, date: 2026-10-05, topic: "Memory: pointers, segmentation faults" }
  - { n: 10, date: 2026-10-07, topic: "Memory: dynamic allocation, stack vs. heap, buffer overflow, file I/O" }
  - { n: 11, date: 2026-10-14, topic: "Data Structures: abstract data types, queues, stacks, linked lists" }
  - { n: 12, date: 2026-10-19, topic: "Data Structures: trees, binary search trees, hash tables, tries" }
  - { n: 13, date: 2026-10-21, topic: "Python: functions, variables, conditionals, loops" }
  - { n: 14, date: 2026-10-26, topic: "Python: modules and packages" }
  - { n: 15, date: 2026-10-28, topic: "SQL: tables, types, statements, constraints, indexes" }
  - { n: 16, date: 2026-11-02, topic: "SQL: transactions, race conditions, SQL injection" }
  - { n: 17, date: 2026-11-04, topic: "Web: internet basics, HTTP, tags/attributes, CSS selectors" }
  - { n: 18, date: 2026-11-09, topic: "Web: JavaScript variables, conditionals, loops, events" }
  - { n: 19, date: 2026-11-11, topic: "Flask: routes, decorators, requests/responses" }
  - { n: 20, date: 2026-11-16, topic: "Flask: sessions, cookies" }
  - { n: 21, date: 2026-11-18, topic: "AI: LLMs, prompt engineering, decision trees, minimax" }
  - { n: 22, date: 2026-11-30, topic: "AI: machine learning, transformer architecture" }
  - { n: 23, date: 2026-12-02, topic: "The End: wrap-up, final project presentations" }
assignments:
  - { id: ps0, title: "Problem Set 0 -- Scratch", kind: pset, assigned: 2026-09-02, due: 2026-09-14, estHours: 6, weight: 0.05, dependsOnSessions: [1, 2] }
  - { id: ps1, title: "Problem Set 1 -- C", kind: pset, assigned: 2026-09-14, due: 2026-09-21, estHours: 8, weight: 0.05, dependsOnSessions: [3, 4] }
  - { id: ps2, title: "Problem Set 2 -- Arrays", kind: pset, assigned: 2026-09-21, due: 2026-09-28, estHours: 8, weight: 0.05, dependsOnSessions: [5, 6] }
  - { id: ps3, title: "Problem Set 3 -- Algorithms", kind: pset, assigned: 2026-09-28, due: 2026-10-05, estHours: 9, weight: 0.05, dependsOnSessions: [7, 8] }
  - { id: ps4, title: "Problem Set 4 -- Memory", kind: pset, assigned: 2026-10-05, due: 2026-10-14, estHours: 9, weight: 0.05, dependsOnSessions: [9, 10] }
  - { id: ps5, title: "Problem Set 5 -- Data Structures", kind: pset, assigned: 2026-10-14, due: 2026-10-21, estHours: 9, weight: 0.05, dependsOnSessions: [11, 12] }
  - { id: ps6, title: "Problem Set 6 -- Python", kind: pset, assigned: 2026-10-21, due: 2026-10-28, estHours: 7, weight: 0.05, dependsOnSessions: [13, 14] }
  - { id: ps7, title: "Problem Set 7 -- SQL", kind: pset, assigned: 2026-10-28, due: 2026-11-04, estHours: 7, weight: 0.05, dependsOnSessions: [15, 16] }
  - { id: ps8, title: "Problem Set 8 -- Web and Flask", kind: pset, assigned: 2026-11-04, due: 2026-11-16, estHours: 9, weight: 0.05, dependsOnSessions: [17, 18, 19, 20] }
  - { id: ps9, title: "Problem Set 9 -- AI", kind: pset, assigned: 2026-11-16, due: 2026-11-30, estHours: 7, weight: 0.05, dependsOnSessions: [21, 22] }
  # No exams in real CS50 -- the final project stands in for a final exam.
  - id: final_project
    title: "Final Project"
    kind: project
    assigned: 2026-10-25
    due: 2026-12-07
    weight: 0.50
    brackets: { moderate: 15, narrow: 20 }
    stages:
      - { id: proposal, due: 2026-11-15 }
